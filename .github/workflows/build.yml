name: Build ESP-BOX Original 2026 with HA addon

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the esp-box repository
      - name: Checkout esp-box repository
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      # 2. Build and Generate Binaries
      - name: Build and Generate Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          command: |
            # --- 1. Prepare sdkconfig ---
            rm -f sdkconfig sdkconfig.defaults
            cp sdkconfig.ci.box sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX=y" >> sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=n" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=n" >> sdkconfig.defaults

            # --- 2. Build Project ---
            idf.py set-target esp32s3
            idf.py build

            # --- 3. Prepare SPIFFS storage ---
            mkdir -p ./spiffs_image
            cp -r ./image/* ./spiffs_image/ || echo "No UI images, skipping"

            mkdir -p build
            python /opt/esp/idf/components/spiffs/spiffsgen.py 0x28a000 ./spiffs_image build/storage.bin --page-size=256 --obj-name-len=32 --meta-len=4 --use-magic --use-magic-len

            # --- 4. Generate Voice Model ---
            SR_PATH=$(find ../../ -name "movemodel.py" | head -n 1)
            python "$SR_PATH" -d1 sdkconfig -d2 "$(dirname "$SR_PATH")" -d3 build || echo "Voice model generation failed"
            cp build/srmodels/srmodels.bin build/ || echo "Model file missing, skipping"

            # --- 5. Debug: check all files exist ---
            echo "=== DEBUG FILES BEFORE MERGE ==="
            ls -lah build/

            # --- 6. Merge all binaries into one firmware image ---
            esptool --chip esp32s3 merge_bin -o build/firmware_merged.bin -f raw \
              0x0 build/bootloader/bootloader.bin \
              0x20000 build/factory_demo.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x16000 build/ota_data_initial.bin \
              0x6c4000 build/srmodels.bin \
              0x43a000 build/storage.bin

      # 3. Upload Binaries
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-v1-complete-bundle
          path: |
            examples/factory_demo/build/firmware_merged.bin
            examples/factory_demo/build/storage.bin
            examples/factory_demo/build/srmodels.bin
