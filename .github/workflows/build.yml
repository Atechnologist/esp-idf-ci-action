name: Build ESP32-S3-BOX-3 Factory Demo

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: ESP-IDF Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3
        target: esp32s3
        path: examples/factory_demo
        command: |

          echo "===== CLEAN ====="
          idf.py fullclean

          echo "===== FORCE TARGET ====="
          idf.py set-target esp32s3

          echo "===== COPY SDKCONFIG ====="
          cp sdkconfig.ci.box sdkconfig.defaults

          echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults

          echo "===== PREPARE SPIFFS ====="
          mkdir -p ./spiffs_image

          if [ -d ./image ] && [ "$(ls -A ./image)" ]; then
              cp -r ./image/* ./spiffs_image/
          else
              echo "Creating dummy SPIFFS file"
              echo "dummy" > ./spiffs_image/dummy.txt
          fi

          echo "===== BUILD FIRMWARE ====="
          idf.py build

          echo "===== GENERATE SPIFFS IMAGE ====="
          python /opt/esp/idf/components/spiffs/spiffsgen.py \
              0x28a000 ./spiffs_image build/storage.bin

          echo "===== GENERATE VOICE MODEL ====="
          SR_PATH=$(find ../../ -name movemodel.py | head -n 1)

          if [ -n "$SR_PATH" ]; then
              python "$SR_PATH" -d1 sdkconfig -d2 "$(dirname "$SR_PATH")" -d3 build
              cp build/srmodels/srmodels.bin build/model.bin || true
          else
              echo "Voice model script not found, skipping."
          fi
          echo "===== MERGING BINARIES ====="
          
          esptool.py --chip esp32s3 merge_bin \
            -o build/firmware_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xe000 build/ota_data_initial.bin \
            0x10000 build/factory_demo.bin \
            0x290000 build/storage.bin \
            0x900000 build/model.bin || echo "Model not included"
            - name: Upload Firmware Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: esp32s3-box3-merged
            path: |
              build/firmware_merged.bin
