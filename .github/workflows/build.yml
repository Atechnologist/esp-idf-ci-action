name: Build ESP32-S3-BOX Firmware (Manual ESP-IDF)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ESP-IDF
      run: |
        git clone --recursive https://github.com/espressif/esp-idf.git
        cd esp-idf
        git checkout release/v5.1
        ./install.sh esp32s3
        echo "IDF_PATH=$PWD" >> $GITHUB_ENV

    - name: Build firmware
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo

        idf.py fullclean
        rm -f sdkconfig

        # Force ORIGINAL BOX config
        cp sdkconfig.ci.box sdkconfig
        idf.py set-target esp32s3
        idf.py build

    - name: Merge firmware
      run: |
        cd examples/factory_demo

        esptool.py --chip esp32s3 merge_bin -o firmware_merged.bin \
          --flash_mode dio \
          --flash_size 16MB \
          0x0 build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0x10000 build/factory_demo.bin

    - name: Upload merged firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-box-merged
        path: examples/factory_demo/firmware_merged.bin
