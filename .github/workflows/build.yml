name: Build ESP32-S3-BOX Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout esp-box repo
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          ref: master

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.1

      - name: Build factory_demo for ORIGINAL ESP32-S3-BOX
        run: |
          cd examples/factory_demo

          # Clean everything
          idf.py fullclean
          rm -f sdkconfig

          # Set correct chip
          idf.py set-target esp32s3

          # FORCE original ESP32-S3-BOX config
          cp sdkconfig.ci.box sdkconfig

          # Build
          idf.py build

      - name: Merge firmware into single bin
        run: |
          cd examples/factory_demo

          esptool.py --chip esp32s3 merge_bin -o firmware_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/factory_demo.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: examples/factory_demo/firmware_merged.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-merged
          path: examples/factory_demo/build/firmware_merged.bin
