name: Build ESP32-S3-BOX Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout esp-box repo
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          ref: master

      - name: Install ESP-IDF
        run: |
          git clone --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout release-v5.1
          ./install.sh esp32s3
          . ./export.sh
          echo "IDF_PATH=$PWD" >> $GITHUB_ENV

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py
