name: Build ESP32-S3-BOX-3 (Merged Firmware)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1️⃣ Checkout official ESP-BOX repository
      # ------------------------------------------------------------
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2️⃣ Build + Merge inside ESP-IDF container
      # ------------------------------------------------------------
      - name: Build and Merge Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: examples/factory_demo
          command: |

            set -e

            echo "===== CLEAN ====="
            idf.py fullclean

            echo "===== SET TARGET ====="
            idf.py set-target esp32s3

            echo "===== CONFIGURE BOARD ====="
            cp sdkconfig.ci.box sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults

            echo "===== PREPARE SAFE SPIFFS ====="
            mkdir -p ./spiffs_image
            echo "dummy" > ./spiffs_image/dummy.txt

            echo "===== BUILD ====="
            idf.py build

            echo "===== VERIFY FILES ====="
            ls -la build
            ls -la build/bootloader
            ls -la build/partition_table

            echo "===== MERGE BINARIES ====="

            esptool.py --chip esp32s3 merge_bin \
              -o build/firmware_merged.bin \
              --flash_mode dio \
              --flash_size 16MB \
              0x0 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0xe000 build/ota_data_initial.bin \
              0x10000 build/factory_demo.bin

            echo "===== MERGED FILE CREATED ====="
            ls -la build/firmware_merged.bin

      # ------------------------------------------------------------
      # 3️⃣ Upload merged firmware from workspace
      # ------------------------------------------------------------
      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box3-merged
          path: examples/factory_demo/build/firmware_merged.bin
