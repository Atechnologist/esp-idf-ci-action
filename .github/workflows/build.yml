name: Build ESP32-S3-BOX Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout esp-box repo
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          ref: master

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.1
          target: esp32s3
          path: examples/factory_demo
          command: |
            idf.py fullclean
            rm -f sdkconfig
            cp sdkconfig.ci.box sdkconfig
            idf.py build

      - name: Merge firmware
        run: |
          cd examples/factory_demo
          esptool.py --chip esp32s3 merge_bin -o firmware_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/factory_demo.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: examples/factory_demo/firmware_merged.bin
