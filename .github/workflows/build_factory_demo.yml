name: Build ESP-BOX Original 2026
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Generate Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          command: |
            # 1. Force Original Board Profile and DIO Flash Mode
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX=y" >> sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=n" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=n" >> sdkconfig.defaults
            
            # 2. Build Project
            idf.py build
            
            # 3. Generate Model binary (Voice AI)
            # Using absolute path to sdkconfig file to prevent Directory error
            SR_PATH=$(find ./managed_components -name "movemodel.py" | head -n 1)
            python "$SR_PATH" -d1 "$PWD/sdkconfig" -d2 "$(dirname "$SR_PATH")" -d3 "$PWD/build"
            cp build/srmodels/srmodels.bin build/model.bin || echo "Model failed"
            
            # 4. Generate Storage binary (UI Graphics)
            # For Original BOX, the argument file is often named flash_partition_args
            # We use a wildcard to find the correct partition arguments generated by the build
            ARG_FILE=$(find build/ -name "flash_*_args" | grep -v "project" | head -n 1)
            python $IDF_PATH/components/esptool_py/esptool/esptool.py --chip esp32s3 merge_bin -o build/storage.bin @$ARG_FILE
