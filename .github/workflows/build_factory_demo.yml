name: Build ESP32-S3-BOX Factory Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout WITHOUT recursive submodules
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    # ------------------------------------------------------------
    # 2. Remove broken OpenThread submodule reference
    # ------------------------------------------------------------
    - name: Remove OpenThread submodule
      run: |
        rm -rf components/openthread || true
        git config --file .gitmodules --remove-section submodule.components/openthread/openthread || true

    # ------------------------------------------------------------
    # 3. Setup Python
    # ------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ------------------------------------------------------------
    # 4. Install ESP-IDF v5.3 (unchanged)
    # ------------------------------------------------------------
    - name: Install ESP-IDF
      run: |
        python -m pip install --upgrade pip
        git clone --depth 1 -b release/v5.3 https://github.com/espressif/esp-idf.git $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3
        source ./export.sh

    # ------------------------------------------------------------
    # 5. Fetch ESP-BOX factory_demo
    # ------------------------------------------------------------
    - name: Clone ESP-BOX repo
      run: |
        git clone https://github.com/espressif/esp-box.git
        cd esp-box
        git checkout master

    # ------------------------------------------------------------
    # 6. Select ESP32-S3-BOX-3 config (ONLY CHANGE HERE)
    # ------------------------------------------------------------
    - name: Apply ESP32-S3-BOX-3 SDKConfig
      run: |
        cd esp-box/examples/factory_demo
        cp sdkconfig.ci.box-3 sdkconfig
        echo "CONFIG_OPENTHREAD_ENABLED=n" >> sdkconfig

    # ------------------------------------------------------------
    # 7. Build firmware
    # ------------------------------------------------------------
    - name: Build Factory Demo
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo
        idf.py set-target esp32s3
        idf.py build

    # ------------------------------------------------------------
    # 8. Upload binaries
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-3-factory-demo
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
