name: Build ESP-BOX Factory Demo
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box repository
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Merge Binary
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          # This runs both commands inside the container where esptool is installed
          command: |
            idf.py build
            cd build
            esptool.py --chip esp32s3 merge_bin -o factory_demo_full.bin @flash_args

      - name: Upload Complete Firmware Set
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-factory-demo-complete
          path: |
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
            examples/factory_demo/build/model.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/bootloader/bootloader.bin

