name: Build ESP32-S3-BOX Factory Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Setup Python
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install ESP-IDF v5.3
      - run: |
          git clone --branch v5.3 --depth 1 https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh
          cd ..

      # 4. Export ESP-IDF environment
      - run: |
          source esp-idf/export.sh

      # 5. Select SDKCONFIG for ESP32-S3-BOX-3
      - run: |
          cp examples/factory_demo/sdkconfig.ci.box-3 examples/factory_demo/sdkconfig

      # 6. Build the factory_demo example
      - run: |
          cd examples/factory_demo
          idf.py fullclean
          idf.py build

      # 7. Copy binaries to a single folder for flash webpage
      - run: |
          mkdir -p flash_files
          cp build/bootloader/bootloader.bin flash_files/
          cp build/partition_table/partition-table.bin flash_files/
          cp build/ota_data_initial.bin flash_files/
          cp build/factory_demo.bin flash_files/
          cp build/storage.bin flash_files/
          cp build/model.bin flash_files/

      # 8. Upload binaries as GitHub artifact
      - uses: actions/upload-artifact@v3
        with:
          name: esp32-s3-box-firmware
          path: flash_files/
