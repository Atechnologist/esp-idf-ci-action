name: Build ESP-BOX Original Final
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Generate Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          command: |
            # 1. Hardware Compatibility for v0.1 Original S3-BOX
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX=y" >> sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=n" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=n" >> sdkconfig.defaults
            
            # 2. Build the project
            idf.py build
            
            # 3. Generate Model binary (Fixing the Directory Conflict)
            SR_PATH=$(find ./managed_components -name "movemodel.py" | head -n 1)
            # Use absolute path to the FILE to bypass Directory check
            python "$SR_PATH" -d1 "$GITHUB_WORKSPACE/examples/factory_demo/sdkconfig" -d2 "$(dirname "$SR_PATH")" -d3 "./build"
            cp build/srmodels/srmodels.bin build/model.bin || echo "Model failed"
            
            # 4. Generate Storage binary (Fixing Path Error)
            # Locate the specific partition args for storage (not project)
            ARG_FILE=$(find build/ -name "flash_storage_args" | head -n 1)
            python -m esptool --chip esp32s3 merge_bin -o build/storage.bin @$ARG_FILE
