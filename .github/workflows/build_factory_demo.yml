name: ESP32-S3-BOX CI Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout ESP-IDF
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-idf
        ref: v5.3
        path: esp-idf

    - name: Install ESP-IDF dependencies
      run: |
        cd esp-idf
        ./install.sh esp32s3

    - name: Export ESP-IDF environment
      run: |
        source esp-idf/export.sh
        echo "IDF_PATH=$PWD/esp-idf" >> $GITHUB_ENV

    - name: Build official ESP32-S3-BOX example
      run: |
        source esp-idf/export.sh
        cd esp-idf/examples/esp32_s3_box
        idf.py set-target esp32s3
        idf.py build


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-firmware
        path: |
          esp-idf/examples/boards/esp32_s3_box/build/*.bin
          esp-idf/examples/boards/esp32_s3_box/build/*.elf
          esp-idf/examples/boards/esp32_s3_box/build/flash_args
