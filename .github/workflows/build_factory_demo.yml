name: Build ESP32-S3-BOX Factory Demo (Touch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout (NO submodules)
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    # ------------------------------------------------------------
    # 2. Setup Python
    # ------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ------------------------------------------------------------
    # 3. Install ESP-IDF v5.3 (ESP32-S3)
    # ------------------------------------------------------------
    - name: Install ESP-IDF
      run: |
        python -m pip install --upgrade pip
        git clone --depth 1 -b release/v5.3 https://github.com/espressif/esp-idf.git $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3

    # ------------------------------------------------------------
    # 4. Clone ESP-BOX repository (CORRECT BSP WITH TOUCH)
    # ------------------------------------------------------------
    - name: Clone ESP-BOX
      run: |
        git clone https://github.com/espressif/esp-box.git
        cd esp-box
        git checkout master

    # ------------------------------------------------------------
    # 5. Configure for ESP32-S3-BOX (Touch)
    # ------------------------------------------------------------
    - name: Apply SDKConfig for ESP32-S3-BOX
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        # Correct config for BOX v1.0 (touch)
        cp sdkconfig.ci.box sdkconfig

        # Explicit safety (optional but fine)
        echo "CONFIG_LVGL_TOUCH_CONTROLLER_ENABLED=y" >> sdkconfig

    # ------------------------------------------------------------
    # 6. Build firmware
    # ------------------------------------------------------------
    - name: Build Factory Demo
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo
        idf.py set-target esp32s3
        idf.py build

    # ------------------------------------------------------------
    # 7. Upload binaries (ESP Web Flasher compatible)
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-factory-demo-touch
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
          esp-box/examples/factory_demo/build/model.bin
