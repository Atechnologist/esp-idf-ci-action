name: Build ESP-BOX Factory Demo
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box repository
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive' # CRITICAL: esp-box relies on many submodules

      - name: Build Factory Demo
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3  # Stable 2026 version for ESP-BOX
          target: esp32s3        # ESP-BOX always uses S3
          path: 'examples/factory_demo'

      - name: Create Merged Binary
        # This makes it easier to flash via web tools later
        shell: bash
        run: |
          cd examples/factory_demo/build
          # Note: idf.py is available in the action environment
          # This creates a single file at 0x0 offset
          esptool.py --chip esp32s3 merge_bin -o factory_demo_full.bin @flash_args

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-factory-demo
          path: |
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/factory_demo_full.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/bootloader/bootloader.bin
