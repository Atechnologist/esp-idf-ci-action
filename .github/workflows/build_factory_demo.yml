name: Build ESP-BOX Original 2026
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Generate Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          command: |
            # 1. Force Hardware Compatibility
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX=y" >> sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=n" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=n" >> sdkconfig.defaults
            
            # 2. Build Project
            idf.py build
            
            # 3. Generate Model binary (Voice AI)
            # Use local path to ensure sdkconfig is treated as a file
            SR_PATH=$(find ./managed_components -name "movemodel.py" | head -n 1)
            python "$SR_PATH" -d1 sdkconfig -d2 "$(dirname "$SR_PATH")" -d3 build
            cp build/srmodels/srmodels.bin build/model.bin || echo "Model failed"
            
            # 4. Generate Storage binary (UI Graphics)
            # Instead of looking for args files, we manually pack the image folder
            python $IDF_PATH/components/spiffs/spiffsgen.py 0x28a000 image build/storage.bin

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-v0.1-bundle
          path: |
            examples/factory_demo/build/bootloader/bootloader.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/ota_data_initial.bin
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
            examples/factory_demo/build/model.bin
