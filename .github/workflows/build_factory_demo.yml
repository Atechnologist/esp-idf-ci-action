name: Build ESP32-S3-BOX Factory Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout YOUR repo (no submodules)
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    # ------------------------------------------------------------
    # 2. Setup Python
    # ------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ------------------------------------------------------------
    # 3. Install ESP-IDF v5.3
    # ------------------------------------------------------------
    - name: Install ESP-IDF
      run: |
        python -m pip install --upgrade pip
        git clone --depth 1 -b release/v5.3 https://github.com/espressif/esp-idf.git $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3
        source ./export.sh

    # ------------------------------------------------------------
    # 4. Clone ESP-BOX WITHOUT submodules
    # ------------------------------------------------------------
    - name: Clone ESP-BOX (no submodules)
      run: |
        git clone --depth 1 --no-recurse-submodules https://github.com/espressif/esp-box.git

    # ------------------------------------------------------------
    # 5. HARD DISABLE OPENTHREAD INSIDE ESP-BOX
    # ------------------------------------------------------------
    - name: Disable OpenThread completely
      run: |
        cd esp-box

        # Remove submodule directory if present
        rm -rf components/openthread || true

        # Remove git submodule references
        git config --file .gitmodules --remove-section submodule.components/openthread/openthread || true
        git submodule deinit -f components/openthread/openthread || true

    # ------------------------------------------------------------
    # 6. Apply ESP32-S3-BOX SDKConfig
    # ------------------------------------------------------------
    - name: Apply ESP32-S3-BOX SDKConfig
      run: |
        cd esp-box/examples/factory_demo
        cp sdkconfig.ci.box sdkconfig

        # Explicitly disable OpenThread at config level
        echo "CONFIG_OPENTHREAD_ENABLED=n" >> sdkconfig
        echo "CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y" >> sdkconfig

    # ------------------------------------------------------------
    # 7. Build factory_demo
    # ------------------------------------------------------------
    - name: Build Factory Demo
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo
        idf.py set-target esp32s3
        idf.py build

    # ------------------------------------------------------------
    # 8. Upload binaries
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-factory-demo
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
          esp-box/examples/factory_demo/build/model.bin
