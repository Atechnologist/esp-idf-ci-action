name: ESP32-S3-BOX Factory Demo Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Install system dependencies
      # -------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build \
            python3 python3-pip python3-venv \
            libusb-1.0-0

      # -------------------------
      # Clone ESP-IDF
      # -------------------------
      - name: Clone ESP-IDF
        run: |
          git clone --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout v5.1
          git submodule update --init --recursive

      # -------------------------
      # Install ESP-IDF tools
      # -------------------------
      - name: Install ESP-IDF tools
        run: |
          cd esp-idf
          ./install.sh esp32s3

      # -------------------------
      # Clone ESP-BOX repository
      # -------------------------
      - name: Clone ESP-BOX
        run: |
          git clone https://github.com/espressif/esp-box.git

      # -------------------------
      # Build factory_demo (ESP32-S3-BOX-3)
      # -------------------------
      - name: Build factory_demo (ESP32-S3-BOX-3)
        shell: bash
        run: |
          source esp-idf/export.sh

          cd esp-box/examples/factory_demo

          # Use official CI config for BOX-3
          cp sdkconfig.ci.box-3 sdkconfig

          idf.py set-target esp32s3

          # Build everything
          idf.py build

          # Generate flasher args including extra partitions
          idf.py fullclean
          cp sdkconfig.ci.box-3 sdkconfig
          idf.py build
          idf.py fullsize-bin

      # -------------------------
      # Upload flashable binaries
      # -------------------------
      - name: Upload flashable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-factory-demo-binaries
          path: |
            esp-box/examples/factory_demo/build/bootloader/bootloader.bin
            esp-box/examples/factory_demo/build/partition_table/partition-table.bin
            esp-box/examples/factory_demo/build/ota_data_initial.bin
            esp-box/examples/factory_demo/build/factory_demo.bin
            esp-box/examples/factory_demo/build/storage.bin
            esp-box/examples/factory_demo/build/model.bin
            esp-box/examples/factory_demo/build/flasher_args.json
