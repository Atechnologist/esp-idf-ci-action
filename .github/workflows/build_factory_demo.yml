name: Build ESP-BOX Original Final 2026
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box repository
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Generate Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          command: |
            # 1. REMOVE BOX-3 COMPONENTS (Stops the crash)
            rm -rf ../../managed_components/espressif__esp-box-3
            rm -f sdkconfig.defaults.s3_box_3

            # 2. CREATE CUSTOM PARTITION TABLE (Matches your hardware logs)
            cat <<EOF > partitions.csv
            # Name, Type, SubType, Offset, Size, Flags
            nvs,      data, nvs,     ,        0x6000,
            otadata,  data, ota,     ,        0x2000,
            phy_init, data, phy,     ,        0x1000,
            factory,  app,  factory, 0x20000, 0x400000,
            storage,  data, spiffs,  0x43a000,0x28a000,
            model,    data, spiffs,  0x6c4000,0x866000,
            EOF

            # 3. FORCE ORIGINAL BOX CONFIG & CUSTOM PARTITIONS
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX=y" > sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=n" >> sdkconfig.defaults
            echo "CONFIG_PARTITION_TABLE_CUSTOM=y" >> sdkconfig.defaults
            echo "CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions.csv\"" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
            
            # 4. Build Project
            idf.py build
            
            # 5. Generate Storage binary (UI Graphics)
            python /opt/esp/idf/components/spiffs/spiffsgen.py 0x28a000 image build/storage.bin

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-v0.1-final-firmware
          path: |
            examples/factory_demo/build/bootloader/bootloader.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/ota_data_initial.bin
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
