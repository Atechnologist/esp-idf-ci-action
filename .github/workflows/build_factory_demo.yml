name: Build ESP32-S3-BOX Factory Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository without failing on broken submodules
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: false  # initially skip submodules
          fetch-depth: 0

      # 2. Fix submodules manually to avoid missing commit
      - name: Initialize Submodules
        run: |
          # OpenThread commit that exists in upstream repo
          OT_COMMIT=ref-to-working-commit
          git submodule sync --recursive
          git submodule update --init components/unity/unity
          # Replace openthread commit with a working one
          git submodule add -b main https://github.com/openthread/openthread.git components/openthread/openthread
          cd components/openthread/openthread
          git checkout $OT_COMMIT
          cd ../../..

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 4. Install ESP-IDF v5.3
      - name: Install ESP-IDF
        run: |
          python -m pip install --upgrade pip
          git clone --recursive -b release/v5.3 https://github.com/espressif/esp-idf.git $HOME/esp-idf
          cd $HOME/esp-idf
          ./install.sh
          source ./export.sh

      # 5. Copy SDKConfig for ESP32-S3-BOX-3
      - name: Copy SDKConfig for CI build
        run: |
          cp examples/factory_demo/sdkconfig.ci.box-3 examples/factory_demo/sdkconfig

      # 6. Build factory_demo
      - name: Build Factory Demo
        run: |
          source $HOME/esp-idf/export.sh
          cd examples/factory_demo
          idf.py build

      # 7. Upload all generated .bin files
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v3
        with:
          name: esp32s3-box-factory-demo
          path: |
            examples/factory_demo/build/bootloader/bootloader.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/ota_data_initial.bin
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
            examples/factory_demo/build/srmodels/srmodels.bin
