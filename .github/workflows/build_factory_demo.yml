name: Build ESP32-S3-BOX Factory Demo (Original v0.1)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ESP-IDF v5.3
      run: |
        python -m pip install --upgrade pip
        git clone --depth 1 -b release/v5.3 https://github.com $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3

    - name: Clone ESP-BOX
      run: |
        git clone --recursive https://github.com
        cd esp-box
        git checkout master

    - name: Configure for Original ESP32-S3-BOX
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        # 1. Remove all BOX-3 specific defaults to prevent overrides
        rm -f sdkconfig.defaults.s3_box_3

        # 2. Create fresh defaults for Original BOX (v0.1)
        cat <<EOF > sdkconfig.defaults
        CONFIG_ESP_BOX_BOARD_S3_BOX=y
        CONFIG_ESP_BOX_BOARD_S3_BOX_3=n
        CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
        CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
        CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
        CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
        EOF

    - name: Build Firmware and Storage
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo
        idf.py set-target esp32s3
        idf.py build
        
        # Manually generate storage.bin (UI graphics)
        # Partition size 0x28a000 matches standard ESP-BOX factory demo
        python $HOME/esp-idf/components/spiffs/spiffsgen.py 0x28a000 image build/storage.bin

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp-box-v01-factory-demo
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
