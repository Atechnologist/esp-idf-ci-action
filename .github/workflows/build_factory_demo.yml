name: Build ESP-BOX Original 2026
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box repository
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Generate Compatible Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          command: |
            # 1. Clean out the BOX-3 defaults that cause the crash
            rm -f sdkconfig.defaults.s3_box_3 sdkconfig
            
            # 2. Force Original Board Profile and DIO Flash Mode
            # Overwriting the main defaults file is the most reliable way
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX=y" > sdkconfig.defaults
            echo "CONFIG_ESP_BOX_BOARD_S3_BOX_3=n" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=n" >> sdkconfig.defaults
            
            # 3. Standard Build (Using the working logic from before)
            idf.py build
            
            # 4. Generate Storage binary (UI Graphics)
            # Use the absolute path to spiffsgen inside the container
            python /opt/esp/idf/components/spiffs/spiffsgen.py 0x28a000 image build/storage.bin

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-v01-final-firmware
          path: |
            examples/factory_demo/build/bootloader/bootloader.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/ota_data_initial.bin
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
