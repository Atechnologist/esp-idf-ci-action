name: Build ESP32-S3-BOX Factory Demo (Stable)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1️⃣ Checkout ESP-BOX repository (NO recursive submodules)
    # ------------------------------------------------------------
    - name: Checkout esp-box
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        fetch-depth: 1
        submodules: false

    # ------------------------------------------------------------
    # 2️⃣ Setup Python
    # ------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ------------------------------------------------------------
    # 3️⃣ Install ESP-IDF v5.3 (stable)
    # ------------------------------------------------------------
    - name: Install ESP-IDF
      run: |
        python -m pip install --upgrade pip
        git clone --depth 1 -b release/v5.3 https://github.com/espressif/esp-idf.git $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3
        source ./export.sh

    # ------------------------------------------------------------
    # 4️⃣ Select ESP32-S3-BOX (ORIGINAL) config
    # ------------------------------------------------------------
    - name: Apply ESP32-S3-BOX SDKConfig
      run: |
        cd examples/factory_demo
        cp sdkconfig.ci.box sdkconfig

    # ------------------------------------------------------------
    # 5️⃣ Build factory_demo
    # ------------------------------------------------------------
    - name: Build Factory Demo
      run: |
        source $HOME/esp-idf/export.sh
        cd examples/factory_demo
        idf.py set-target esp32s3
        idf.py build

    # ------------------------------------------------------------
    # 6️⃣ Upload binaries (ESP Launchpad compatible)
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-factory-demo
        path: |
          examples/factory_demo/build/bootloader/bootloader.bin
          examples/factory_demo/build/partition_table/partition-table.bin
          examples/factory_demo/build/ota_data_initial.bin
          examples/factory_demo/build/factory_demo.bin
          examples/factory_demo/build/storage.bin
