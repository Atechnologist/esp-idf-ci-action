name: Build ESP-BOX Original 2026
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 1

      - name: Build ESP-BOX factory_demo
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: examples/factory_demo
          command: |
            set -e
            # 1. Clean and Setup SDKCONFIG (Force Original BOX & DIO mode)
            rm -f sdkconfig.defaults* sdkconfig
            cat <<EOF > sdkconfig.defaults
            CONFIG_ESP_BOX_BOARD_S3_BOX=y
            CONFIG_ESP_BOX_BOARD_S3_BOX_3=n
            CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
            CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
            CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
            CONFIG_PARTITION_TABLE_CUSTOM=y
            CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
            CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
            EOF

            # 2. Setup Partition Table (Matches your log offsets)
            cat <<EOF > partitions.csv
            # Name, Type, SubType, Offset, Size
            nvs,      data, nvs,     ,        0x6000,
            otadata,  data, ota,     ,        0x2000,
            phy_init, data, phy,     ,        0x1000,
            factory,  app,  factory, 0x20000, 0x400000,
            storage,  data, spiffs,  0x43a000,0x28a000,
            model,    data, spiffs,  0x6c4000,0x866000,
            EOF

            # 3. Build (Path is relative to the Action's 'path' input)
            idf.py build

            # 4. Generate Storage Binary (Explicit path to graphics)
            # 0x28a000 is the size defined in partitions.csv
            python /opt/esp/idf/components/spiffs/spiffsgen.py 0x28a000 image build/storage.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-v01-firmware
          path: |
            examples/factory_demo/build/bootloader/bootloader.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/ota_data_initial.bin
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
