name: Build ESP32-S3-BOX Factory Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IDF_SKIP_SUBMODULES: "1"
      ESP_IDF_VERSION: "release/v5.3"

    steps:
    # ------------------------------------------------------------
    # 1. Checkout YOUR repo (no submodules)
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    # ------------------------------------------------------------
    # 2. Setup Python
    # ------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ------------------------------------------------------------
    # 3. Clone ESP-IDF WITHOUT submodules (CRITICAL)
    # ------------------------------------------------------------
    - name: Clone ESP-IDF (NO submodules)
      run: |
        git clone \
          --depth 1 \
          --filter=blob:none \
          --no-checkout \
          -b $ESP_IDF_VERSION \
          https://github.com/espressif/esp-idf.git $HOME/esp-idf

        cd $HOME/esp-idf
        git checkout HEAD
        rm -rf components/openthread || true

    # ------------------------------------------------------------
    # 4. Install ESP-IDF tools (ESP32-S3 only)
    # ------------------------------------------------------------
    - name: Install ESP-IDF tools
      run: |
        cd $HOME/esp-idf
        python -m pip install --upgrade pip
        ./install.sh esp32s3

    # ------------------------------------------------------------
    # 5. Clone ESP-BOX repository
    # ------------------------------------------------------------
    - name: Clone ESP-BOX
      run: |
        git clone --depth 1 https://github.com/espressif/esp-box.git

    # ------------------------------------------------------------
    # 6. Apply ESP32-S3-BOX config (NO OpenThread)
    # ------------------------------------------------------------
    - name: Configure factory_demo
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        cp sdkconfig.ci.box sdkconfig

        # HARD disable OpenThread
        echo "CONFIG_OPENTHREAD_ENABLED=n" >> sdkconfig
        echo "CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y" >> sdkconfig

    # ------------------------------------------------------------
    # 7. Build firmware
    # ------------------------------------------------------------
    - name: Build Factory Demo
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        idf.py set-target esp32s3
        idf.py build

    # ------------------------------------------------------------
    # 8. Upload binaries for ESP Web Flasher
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-factory-demo
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
