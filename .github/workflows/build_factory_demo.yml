name: ESP-IDF Factory Demo CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1
        target: esp32s3

    - name: Configure project (GENERATES sdkconfig)
      working-directory: examples/factory_demo
      run: |
        idf.py set-target esp32s3
        idf.py reconfigure

    - name: Build
      working-directory: examples/factory_demo
      run: |
        idf.py build
