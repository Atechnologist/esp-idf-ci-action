name: Build ESP32-S3-BOX Factory Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository and submodules
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive  # pull all submodules
          fetch-depth: 0         # full history to avoid commit mismatch

      # 2. Set up Python (required by ESP-IDF)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install ESP-IDF Tools
      - name: Install ESP-IDF
        run: |
          python -m pip install --upgrade pip
          git clone --recursive -b release/v5.3 https://github.com/espressif/esp-idf.git $HOME/esp-idf
          cd $HOME/esp-idf
          ./install.sh
          source ./export.sh

      # 4. Fix submodules (pull latest if old commit missing)
      - name: Update Submodules to Latest
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      # 5. Copy SDKConfig for ESP32-S3-BOX
      - name: Copy SDKConfig for CI build
        run: |
          cp examples/factory_demo/sdkconfig.ci.box-3 examples/factory_demo/sdkconfig

      # 6. Build factory_demo
      - name: Build Factory Demo
        run: |
          cd examples/factory_demo
          source $HOME/esp-idf/export.sh
          idf.py build

      # 7. Export all generated .bin files for flashing
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v3
        with:
          name: esp32s3-box-factory-demo
          path: |
            examples/factory_demo/build/bootloader/bootloader.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/ota_data_initial.bin
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/storage.bin
            examples/factory_demo/build/srmodels/srmodels.bin
