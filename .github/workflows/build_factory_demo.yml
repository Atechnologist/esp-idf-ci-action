name: Build ESP32-S3-BOX Factory Demo (Stable)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # 1. Checkout repository (NO submodules)
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    # ------------------------------------------------------------
    # 2. Setup Python
    # ------------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ------------------------------------------------------------
    # 3. Clone ESP-IDF v5.2.2 (LAST STABLE)
    # ------------------------------------------------------------
    - name: Clone ESP-IDF v5.2.2
      run: |
        git clone --depth 1 -b v5.2.2 https://github.com/espressif/esp-idf.git $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3

    # ------------------------------------------------------------
    # 4. Clone ESP-BOX
    # ------------------------------------------------------------
    - name: Clone ESP-BOX
      run: |
        git clone --depth 1 https://github.com/espressif/esp-box.git

    # ------------------------------------------------------------
    # 5. Configure factory_demo (NO OpenThread)
    # ------------------------------------------------------------
    - name: Configure ESP32-S3-BOX
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        cp sdkconfig.ci.box sdkconfig
        echo "CONFIG_OPENTHREAD_ENABLED=n" >> sdkconfig
        echo "CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y" >> sdkconfig

    # ------------------------------------------------------------
    # 6. Build firmware
    # ------------------------------------------------------------
    - name: Build Factory Demo
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        idf.py set-target esp32s3
        idf.py build

    # ------------------------------------------------------------
    # 7. Upload binaries (ESP Web Flasher ready)
    # ------------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-factory-demo
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
