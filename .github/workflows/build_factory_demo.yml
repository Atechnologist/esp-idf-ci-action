name: Build ESP32-S3-BOX Factory Demo (Touch Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ESP-IDF v5.3
      run: |
        git clone --depth 1 -b release/v5.3 https://github.com $HOME/esp-idf
        cd $HOME/esp-idf
        ./install.sh esp32s3

    - name: Clone ESP-BOX
      run: |
        git clone --recursive https://github.com
        cd esp-box
        git checkout master

    - name: Force Original Hardware Profile
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo

        # 1. DELETE BOX-3 COMPONENTS (This is the only way to stop it from being detected)
        rm -rf ../../managed_components/espressif__esp-box-3
        rm -f sdkconfig.defaults.s3_box_3

        # 2. Force Original BOX Config
        cat <<EOF > sdkconfig.defaults
        CONFIG_ESP_BOX_BOARD_S3_BOX=y
        CONFIG_ESP_BOX_BOARD_S3_BOX_3=n
        CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
        CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
        CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
        EOF

    - name: Build Firmware
      run: |
        source $HOME/esp-idf/export.sh
        cd esp-box/examples/factory_demo
        
        # 3. Explicitly set the Board Version for the BSP
        export ESP_BOX_BOARD=S3_BOX
        
        idf.py set-target esp32s3
        idf.py build
        
        # 4. Generate Storage Binary
        python $HOME/esp-idf/components/spiffs/spiffsgen.py 0x28a000 image build/storage.bin

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp-box-v01-touch-fixed
        path: |
          esp-box/examples/factory_demo/build/bootloader/bootloader.bin
          esp-box/examples/factory_demo/build/partition_table/partition-table.bin
          esp-box/examples/factory_demo/build/ota_data_initial.bin
          esp-box/examples/factory_demo/build/factory_demo.bin
          esp-box/examples/factory_demo/build/storage.bin
