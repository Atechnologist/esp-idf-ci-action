
name: Build ESP-BOX Compatible (2026)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout esp-box repository
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          submodules: 'recursive'

      - name: Build and Generate Compatible Binaries
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: 'examples/factory_demo'
          # We force DIO mode to fix the 'invalid segment' error for S3 v0.1 chips
          command: |
            # 1. Apply compatibility settings for S3 v0.1 hardware
            echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=n" >> sdkconfig.defaults
            echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
            
            # 2. Build the project
            idf.py build
            
            # 3. Generate the Model binary (Voice Recognition)
            SR_PATH=$(find . -name "esp-sr" -type d | head -n 1)
            python $SR_PATH/movemodel.py -d1 ./sdkconfig -d2 $SR_PATH -d3 ./build
            cp build/srmodels/srmodels.bin build/model.bin
            
            # 4. Generate the Storage binary (UI Graphics)
            python $IDF_PATH/components/esptool_py/esptool/esptool.py --chip esp32s3 merge_bin -o build/storage.bin @build/flash_storage_args

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-compat-bundle
          path: |
            examples/factory_demo/build/factory_demo.bin
            examples/factory_demo/build/model.bin
            examples/factory_demo/build/storage.bin
            examples/factory_demo/build/partition_table/partition-table.bin
            examples/factory_demo/build/bootloader/bootloader.bin
