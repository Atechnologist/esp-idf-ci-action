name: Build ESP-BOX Matter Switch
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # Use the official Matter container which has the environment pre-installed
    container: espressif/esp-matter:latest 

    steps:
      - name: Checkout esp-box (Your current repo or the official one)
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          path: 'esp-box'
          submodules: 'recursive'

      - name: Build Matter Switch Example
        shell: bash
        run: |
          # 1. Source the pre-installed IDF and Matter environments
          . /opt/espressif/esp-idf/export.sh
          . /opt/espressif/esp-matter/export.sh
          
          # 2. Navigate to the example folder
          cd esp-box/examples/matter_switch
          
          # 3. Set target and build
          idf.py set-target esp32s3
          idf.py build
          
          # 4. (Optional) Merge binaries for easy flashing
          idf.py merge-bin -o matter_switch_merged.bin

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-matter-switch
          path: |
            esp-box/examples/matter_switch/build/*.bin
            esp-box/examples/matter_switch/matter_switch_merged.bin
