name: Build ESP-BOX Example
on: [push, workflow_dispatch]

jobs:
  build-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Required for esp-box components if any

      - name: Checkout esp-box repository (example)
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          path: 'esp-box'
          submodules: 'recursive'

      - name: Build matter_switch
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.1'      # Recommended version for ESP-BOX
          target: 'esp32s3'           # Target chip for ESP-BOX
          path: 'esp-box/examples/matter_switch' # Path to checked-out example in esp-box
        env:
          ESP_MATTER_PATH: ${{ github.workspace }}/esp-box

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-matter_switch
          path: 'esp-box/examples/matter_switch/build/*.bin' # Collects generated binaries
