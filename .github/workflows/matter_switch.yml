name: Build ESP-BOX Matter Switch
on: [push, workflow_dispatch]

jobs:
  build-matter:
    runs-on: ubuntu-latest
    # Use the dedicated Matter container
    container: espressif/esp-matter:latest 

    steps:
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          path: 'esp-box'
          submodules: 'recursive'

      - name: Build matter_switch
        shell: bash
        run: |
          # 1. Source the pre-installed environments inside the container
          . /opt/espressif/esp-idf/export.sh
          . /opt/espressif/esp-matter/export.sh
          
          # 2. Navigate to example
          cd esp-box/examples/matter_switch
          
          # 3. Build specifically for S3 target
          idf.py set-target esp32s3
          idf.py build
          
          # 4. Optional: Merge binaries for easier web flashing
          idf.py merge-bin -o matter_switch_full.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-matter-binaries
          path: |
            esp-box/examples/matter_switch/build/*.bin
            esp-box/examples/matter_switch/matter_switch_full.bin
