name: Build ESP-BOX Matter Switch
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # Official Matter container has all necessary tools (ZAP, GN, etc.)
    container: espressif/esp-matter:latest 

    steps:
      - name: Checkout esp-box
        uses: actions/checkout@v4
        with:
          repository: 'espressif/esp-box'
          path: 'esp-box'
          submodules: 'recursive'

      - name: Build Matter Switch
        shell: bash
        run: |
          # 1. Source the pre-configured environments in the container
          . /opt/espressif/esp-idf/export.sh
          . /opt/espressif/esp-matter/export.sh
          
          # 2. Navigate to example
          cd esp-box/examples/matter_switch
          
          # 3. Explicitly set target first to resolve dependencies
          idf.py set-target esp32s3
          
          # 4. Build binary
          idf.py build
          
          # 5. Merge for easy flashing
          idf.py merge-bin -o matter_switch_merged.bin

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-matter-switch
          path: |
            esp-box/examples/matter_switch/build/*.bin
            esp-box/examples/matter_switch/matter_switch_merged.bin
